<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eric Ishekwene</title>
    <meta
      name="description"
      content="Eric Ishekwene is a founder, developer and creative in Columbus, OH who designs and builds products people use: Coachable, plus internships at eero (Amazon) and Kino."
    />
    <meta name="author" content="Eric Ishekwene" />
    <link rel="canonical" href="https://ericishekwene.org/" />

    <!-- Theme before first paint: localStorage "theme", default dark (DECISIONS #2). -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* storage blocked: keep the default */
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#fafafa' : '#0a0a0a');
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter. /og.jpg is added at integration. -->
